<!DOCTYPE html>
<html>
<head>
    <title>Borg Connect Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Set CSRF token as default header for all $http requests
        angular.module('loginApp').config(['$httpProvider', function($httpProvider) {
            $httpProvider.defaults.headers.common['X-CSRFToken'] = '{{ csrf_token }}';
        }]);
    </script>
</head>
<body>
    <h2>Borg Connect Sampled Data (Live from Redis)</h2>
    <canvas id="myChart" width="400" height="200"></canvas>
    {% csrf_token %}

    <script>        
        async function fetchData() {
            const response = await fetch("/core/api/chart-data/");
            const data = await response.json();

            const labels = Object.keys(data);
            const values = Object.values(data).map(entry => entry.value); // `value` field from your sampling service

            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Sampled Values',
                        data: values,
                        backgroundColor: 'rgba(54, 162, 235, 0.7)'
                    }]
                },
                options: {
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        fetchData();
        setInterval(() => {
            location.reload(); // refresh every 5 seconds to get new Redis data
        }, 5000);
    </script>
</body>
</html>
