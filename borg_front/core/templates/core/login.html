<!DOCTYPE html>
<html ng-app="loginApp">
<head>
    <meta charset="utf-8">
    <title>Borg Connect Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Ionic CSS -->
    <link rel="stylesheet" href="https://code.ionicframework.com/1.3.4/css/ionic.min.css" />

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular.min.js"></script>
    
    <!-- Ionic JS -->
    <script src="https://code.ionicframework.com/1.3.4/js/ionic.bundle.min.js"></script>

    <style>
        .login-box {
            margin-top: 50px;
        }
    </style>
</head>
<body ng-controller="LoginCtrl" class="padding">

    <ion-pane>
        <ion-header-bar class="bar-positive">
            <h1 class="title">Borg Connect Login</h1>
        </ion-header-bar>

        <ion-content class="padding login-box">
            <form ng-submit="login()">
                <div class="list">
                    <label class="item item-input">
                        <input type="text" placeholder="Username" ng-model="user.username">
                    </label>
                    <label class="item item-input">
                        <input type="password" placeholder="Password" ng-model="user.password">
                    </label>
                </div>
                <button class="button button-full button-positive" type="submit">Login</button>
                <p class="assertive" ng-if="error">{{ error }}</p>
            </form>
        </ion-content>
    </ion-pane>

    <script>
        angular.module('loginApp', ['ionic'])
        .controller('LoginCtrl', function($scope, $http, $window) {
            $scope.user = {};

            $scope.login = function() {
                $http.post('/core/api/login/', $scope.user)
                .then(function(response) {
                    // On success
                    $window.location.href = "/core/welcome/";
                }, function(error) {
                    $scope.error = "Invalid username or password.";
                });
            };
        });
    </script>
</body>
</html>
